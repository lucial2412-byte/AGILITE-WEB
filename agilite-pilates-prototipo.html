<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Agilité Pilates · Reserva tu clase</title>
<link rel="icon" id="faviconLink" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* paleta derivada del color de marca (#f9bcbb) y de la paleta compartida */
  --brand:#f9bcbb;
  --brand-dark:#8a4a4d;
  --brand-darker:#5e2a2e;
  --brand-light:#f5b8c7;
  --brand-tint:#fdf1f1;
  --accent:#e78a9d;
  --sage:#8a4a4d;
  --sage-bg:#fcd9c9;
  --danger:#5e2a2e;
  --danger-bg:#f3ddd8;
  --near-black:#2e1a1c;
  --near-black-2:#4a2b2d;
  --sand-0:#fffcfa;
  --sand-50:#fdf6f3;
  --sand-100:#f8ece6;
  --ink-900:#332420;
  --ink-700:#5c463f;
  --ink-500:#8f7a72;
  --ink-400:#a3908a;
  --ink-300:#cbb9b3;
  --line:#f0e2db;
  --line-2:#e6d2ce;
  --dot-free:#e6d2ce;
  --dot-taken:#dba3ab;
  --dot-mine:#8a4a4d;
  --shadow-sm:0 2px 8px rgba(46,26,28,.06);
  --shadow-md:0 8px 28px rgba(46,26,28,.10);
  --shadow-lg:0 18px 46px rgba(46,26,28,.20);
  --radius-lg:22px;
  --radius-xl:26px;
  --radius-md:14px;
  --radius-sm:10px;
  --font-serif:'Cormorant Garamond', Georgia, serif;
  --font-sans:'Jost', 'Segoe UI', Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;font-family:var(--font-sans);background:var(--sand-50);color:var(--ink-900);-webkit-font-smoothing:antialiased;}
img{max-width:100%;display:block;}
button{font-family:inherit;cursor:pointer;}
a{color:var(--brand-dark);text-decoration:none;}
a:hover{color:var(--brand-darker);}
h1,h2,h3{font-family:var(--font-serif);font-weight:600;margin:0;color:var(--ink-900);}
p{margin:0;}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px;}
.eyebrow{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--brand-dark);font-weight:600;margin-bottom:12px;}

/* buttons */
.btn{border-radius:999px;border:1.5px solid transparent;font-weight:500;font-size:15px;transition:all .18s ease;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--brand-dark);color:#fff;box-shadow:0 4px 14px rgba(138,74,77,.28);}
.btn-primary:hover{background:var(--brand-darker);}
.btn-outline{background:transparent;border-color:var(--brand-dark);color:var(--brand-dark);}
.btn-outline:hover{background:var(--brand-tint);}
.btn-outline.danger{border-color:var(--line-2);color:var(--danger);}
.btn-outline.danger:hover{background:var(--danger-bg);}
.btn-outline.muted{border-color:var(--line-2);color:var(--ink-700);}
.btn-outline.on{background:var(--sand-100);}
.btn-outline.light{border-color:rgba(255,253,251,.55);color:var(--sand-0);}
.btn-outline.light:hover{background:rgba(255,253,251,.14);}
.btn-dark{background:var(--near-black);color:var(--sand-0);}
.btn-dark:hover{background:var(--near-black-2);}
.btn-uppercase{text-transform:uppercase;letter-spacing:.16em;font-size:12.5px;padding:16px 32px;}
.btn-sm{padding:10px 18px;font-size:13.5px;}
.btn-block{width:100%;}
.btn-text{background:none;border:none;color:var(--brand-dark);padding:6px 2px;text-decoration:underline;text-underline-offset:4px;font-size:14.5px;}
.btn-text:hover{color:var(--brand-darker);}

/* demo strip */
.demo-strip{background:var(--near-black);color:var(--sand-100);font-size:12px;display:flex;align-items:center;justify-content:center;gap:14px;padding:9px 16px;flex-wrap:wrap;}
.demo-strip .lbl{letter-spacing:.16em;text-transform:uppercase;color:var(--ink-300);font-size:10px;}
.demo-seg{display:flex;background:var(--near-black-2);border-radius:999px;padding:3px;gap:2px;}
.demo-seg button{background:none;border:none;color:var(--ink-300);padding:6px 15px;border-radius:999px;font-size:12.5px;}
.demo-seg button.active{background:var(--brand-dark);color:#fff;}

/* header */
header.site-header{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--sand-0);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:80;flex-wrap:wrap;}
.logo{display:flex;align-items:center;gap:12px;cursor:pointer;flex:none;}
.logo img{height:44px;width:auto;border-radius:8px;}
.logo-loc{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--brand-dark);border-left:1px solid var(--line);padding-left:12px;white-space:nowrap;display:none;}
nav.main-nav{display:none;flex:1;justify-content:center;gap:4px;flex-wrap:wrap;}
nav.main-nav button{background:none;border:none;padding:10px 17px;border-radius:999px;font-size:14.5px;color:var(--ink-700);font-weight:400;transition:all .15s ease;}
nav.main-nav button:hover{background:var(--sand-100);color:var(--ink-900);}
nav.main-nav button.active{background:var(--brand-light);color:var(--brand-darker);font-weight:600;}
.header-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex:none;}
.phone-pill{display:flex;align-items:center;gap:7px;border:1.5px solid var(--line-2);color:var(--brand-dark);padding:9px 15px;border-radius:999px;font-size:13px;font-weight:500;}
.phone-pill .icon{width:14px;height:14px;}
.phone-pill .lbl{color:var(--ink-500);display:none;}
.account-area{position:relative;display:flex;align-items:center;gap:10px;}
.who-txt{line-height:1.3;text-align:right;display:none;}
.who-txt b{display:block;font-size:13px;color:var(--ink-900);font-weight:500;white-space:nowrap;}
.who-txt span{display:block;font-size:11px;color:var(--ink-400);white-space:nowrap;}
.avatar-btn{width:42px;height:42px;border-radius:50%;background:var(--brand-light);color:var(--brand-darker);border:none;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13.5px;flex:none;}
.account-menu{position:absolute;top:52px;right:0;background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-md);min-width:220px;padding:10px;display:none;z-index:90;}
.account-menu.open{display:block;}
.account-menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px;}
.account-menu .who b{display:block;font-size:14.5px;}
.account-menu .who span{font-size:12px;color:var(--ink-500);}
.account-menu button{width:100%;text-align:left;background:none;border:none;padding:10px 10px;border-radius:8px;font-size:14px;color:var(--ink-700);}
.account-menu button:hover{background:var(--sand-100);}
.hamburger{display:flex;background:none;border:none;padding:8px;color:var(--ink-900);}
.hamburger .icon{width:22px;height:22px;}
@media(min-width:920px){
  nav.main-nav{display:flex;}
  .hamburger{display:none;}
  .logo-loc{display:block;}
  .phone-pill .lbl{display:inline;}
  .who-txt{display:block;}
}

/* mobile menu */
.mobile-menu{position:fixed;inset:0;z-index:150;background:rgba(46,26,28,.4);display:none;}
.mobile-menu.open{display:block;}
.mobile-menu-panel{position:absolute;top:0;right:0;bottom:0;width:min(310px,86vw);background:var(--sand-50);padding:20px;overflow-y:auto;box-shadow:var(--shadow-lg);animation:slideIn .2s ease;}
@keyframes slideIn{from{transform:translateX(24px);opacity:0;}to{transform:translateX(0);opacity:1;}}
.mm-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.mm-close{background:var(--sand-100);border:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-700);}
.mobile-menu button.mm-link{display:block;width:100%;text-align:left;background:none;border:none;padding:14px 12px;font-size:16px;font-weight:400;color:var(--ink-900);border-radius:12px;}
.mobile-menu button.mm-link.active{background:var(--brand-light);color:var(--brand-darker);font-weight:600;}
.mobile-menu a{display:flex;align-items:center;gap:10px;padding:14px 12px;font-size:15px;color:var(--ink-900);}
.mobile-menu hr{border:none;border-top:1px solid var(--line);margin:8px 0;}

/* rotabanner */
.rotabanner{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:var(--near-black);}
.rota-bg{position:absolute;inset:0;background-size:cover;background-position:center 30%;}
.rota-overlay{position:relative;background:linear-gradient(100deg, rgba(46,26,28,.92) 0%, rgba(94,42,46,.8) 48%, rgba(231,138,157,.4) 100%);padding:18px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.rota-tag{font-size:10px;letter-spacing:.18em;text-transform:uppercase;background:var(--accent);color:var(--near-black);padding:6px 13px;border-radius:999px;flex:none;font-weight:600;}
.rota-text{margin:0;flex:1 1 260px;min-width:0;font-size:14.5px;line-height:1.6;color:var(--sand-0);font-weight:300;}
.rota-text b{color:var(--accent);font-weight:500;}
.rota-cta{border:1px solid var(--brand-light);background:rgba(253,241,240,.12);color:var(--sand-0);border-radius:999px;padding:10px 20px;font-size:13.5px;flex:none;}
.rota-cta:hover{background:rgba(253,241,240,.24);}
.rota-dots{display:flex;gap:6px;flex:none;}
.rota-dots button{border:none;padding:0;height:6px;border-radius:999px;background:rgba(253,241,240,.4);}
.rota-dots button.active{background:var(--accent);width:18px !important;}
@media(max-width:640px){.rota-text{font-size:13px;}}

/* main-app pages */
main.app-main{max-width:1080px;margin:0 auto;padding:44px 24px 90px;min-height:50vh;}
main.app-main.bleed{padding:0;}
.page-head{margin-bottom:30px;text-align:center;max-width:580px;margin-left:auto;margin-right:auto;}
.page-head h1{font-size:clamp(30px,4.5vw,44px);margin-bottom:14px;font-weight:400;}
.page-head .subtitle{color:var(--ink-500);font-size:15.5px;line-height:1.7;font-weight:300;}

/* info banner (next class) */
.info-banner{display:flex;align-items:center;gap:20px;background:var(--sand-0);border:1px solid var(--line);border-radius:var(--radius-xl);padding:22px 26px;margin-bottom:26px;box-shadow:var(--shadow-sm);flex-wrap:wrap;}
.info-banner .icon-circle{width:52px;height:52px;border-radius:50%;background:var(--brand-tint);color:var(--brand-dark);display:flex;align-items:center;justify-content:center;flex:none;}
.info-banner .icon-circle .icon{width:22px;height:22px;}
.info-banner .txt{flex:1 1 200px;min-width:0;}
.info-banner .txt small{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-400);margin-bottom:5px;}
.info-banner .txt b{font-family:var(--font-serif);font-size:22px;font-weight:600;color:var(--ink-900);}
.info-banner .txt span.meta{display:block;font-size:13px;color:var(--ink-400);margin-top:3px;}

.move-hint{background:var(--brand-tint);border:1px solid var(--brand-light);border-radius:var(--radius-lg);padding:15px 22px;margin-bottom:26px;font-size:14px;color:var(--brand-darker);line-height:1.6;font-weight:300;}
.move-hint b{font-weight:600;}

/* day selector */
.day-selector{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:30px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.day-selector::-webkit-scrollbar{display:none;}
.day-pill{flex:none;min-width:80px;border:1px solid var(--line);background:var(--sand-0);border-radius:18px;padding:14px 10px;text-align:center;transition:all .15s ease;}
.day-pill .dn{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-400);}
.day-pill .num{display:block;font-family:var(--font-serif);font-size:24px;font-weight:600;color:var(--ink-900);margin-top:3px;}
.day-pill.active{background:var(--brand-dark);border-color:var(--brand-dark);}
.day-pill.active .dn{color:var(--brand-light);}
.day-pill.active .num{color:#fff;}
.day-pill.closed{opacity:.5;}

/* schedule grid + class card */
.schedule-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;}
.class-card{background:var(--sand-0);border:1px solid var(--line);border-radius:var(--radius-xl);padding:26px;display:flex;flex-direction:column;gap:18px;transition:transform .18s ease,box-shadow .18s ease;}
.class-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.class-card.mine{background:var(--brand-tint);border-color:var(--brand-light);}
.class-card.past{opacity:.55;}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.card-time{font-family:var(--font-serif);font-size:26px;line-height:1;color:var(--ink-900);font-weight:600;}
.card-instructor{font-size:13px;color:var(--ink-400);margin-top:7px;font-weight:300;}
.tag-pill{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border-radius:999px;flex:none;font-weight:600;}
.tag-mine{background:var(--brand-dark);color:#fff;}
.tag-full{background:var(--sand-100);color:var(--ink-400);}
.tag-open{background:var(--brand-tint);color:var(--brand-dark);}
.tag-libre{background:var(--sage-bg);color:var(--brand-dark);}
.tag-warn{background:var(--brand-light);color:var(--brand-dark);}
.tag-past{background:var(--sand-100);color:var(--ink-300);}
.seat-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.seat{width:13px;height:13px;border-radius:50%;flex:none;border:1.5px solid var(--dot-free);background:transparent;}
.seat.taken{background:var(--dot-taken);border-color:var(--dot-taken);}
.seat.mine{background:var(--dot-mine);border-color:var(--dot-mine);}
.capacity-text{font-size:13.5px;color:var(--ink-500);font-weight:300;}
.card-footer{margin-top:auto;}

/* closed day state */
.closed-state{text-align:center;background:var(--sand-0);border:1px dashed var(--line-2);border-radius:var(--radius-xl);padding:60px 28px;}
.closed-state h3{font-size:24px;margin-bottom:10px;font-weight:600;}
.closed-state p{color:var(--ink-400);font-size:14.5px;font-weight:300;}

/* tiles / stub cards */
.tile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:26px;}
.tile{background:var(--sand-0);border:1px solid var(--line);border-radius:var(--radius-xl);padding:26px;text-align:left;transition:transform .15s ease,box-shadow .15s ease;box-shadow:var(--shadow-sm);}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.tile .icon-circle{width:46px;height:46px;border-radius:50%;background:var(--brand-tint);color:var(--brand-dark);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.tile .icon-circle .icon{width:20px;height:20px;}
.tile h3{font-size:19px;margin-bottom:7px;font-weight:600;}
.tile p{font-size:13.5px;color:var(--ink-500);line-height:1.6;font-weight:300;}
.soft-card{background:var(--sand-0);border:1px solid var(--line);border-radius:var(--radius-xl);padding:30px;box-shadow:var(--shadow-sm);}
.placeholder-note{margin-top:20px;padding:16px 20px;background:var(--sand-100);border-radius:var(--radius-md);color:var(--ink-500);font-size:13.5px;text-align:center;font-weight:300;}
.roadmap-list{margin-top:16px;display:flex;flex-direction:column;gap:10px;text-align:left;}
.roadmap-item{display:flex;gap:10px;align-items:flex-start;background:var(--sand-0);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:13.5px;color:var(--ink-500);font-weight:300;}
.roadmap-item .icon{width:15px;height:15px;color:var(--brand-dark);flex-shrink:0;margin-top:2px;}

/* admin */
.admin-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-top:8px;}
.admin-mini{background:var(--sand-0);border:1px solid var(--line);border-radius:var(--radius-md);padding:20px;}
.admin-mini b{font-size:32px;font-family:var(--font-serif);display:block;color:var(--ink-900);font-weight:600;}
.admin-mini.alert b{color:var(--brand-dark);}
.admin-mini span{font-size:12.5px;color:var(--ink-500);font-weight:300;}

/* ---------- Public home ---------- */
.hero{position:relative;min-height:min(84vh,640px);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:var(--near-black);}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 32%;opacity:0;transition:opacity 1.2s ease;}
.hero-bg.active{opacity:1;}
.hero-scrim{position:absolute;inset:0;background:linear-gradient(to top, rgba(46,26,28,.9) 0%, rgba(46,26,28,.32) 55%, rgba(231,138,157,.28) 100%);}
.hero-inner{position:relative;padding:60px 26px 46px;max-width:1080px;margin:0 auto;width:100%;}
.hero-badge{display:inline-block;background:var(--accent);padding:10px 14px;border-radius:14px;margin-bottom:26px;}
.hero-badge img{height:40px;width:auto;display:block;}
.hero h1.display{margin:0 0 20px;max-width:720px;font-family:var(--font-sans);font-weight:400;font-size:clamp(30px,6vw,54px);line-height:1.05;letter-spacing:.005em;text-transform:uppercase;color:var(--sand-0);}
.hero h1.display i{font-family:var(--font-serif);font-style:italic;text-transform:none;letter-spacing:0;color:var(--accent);font-size:1.12em;}
.hero p.lead{margin:0 0 30px;max-width:460px;font-size:16px;line-height:1.7;color:var(--sand-100);font-weight:300;}
.hero-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.hero-info-pill{display:flex;align-items:center;gap:13px;background:rgba(253,241,240,.14);border:1px solid rgba(253,241,240,.28);border-radius:999px;padding:10px 20px 10px 12px;}
.hero-info-pill .ic{width:32px;height:32px;border-radius:50%;background:var(--sand-0);color:var(--brand-dark);display:flex;align-items:center;justify-content:center;flex:none;}
.hero-info-pill .ic .icon{width:15px;height:15px;}
.hero-info-pill small{display:block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--brand-light);}
.hero-info-pill span{display:block;font-size:14px;color:var(--sand-0);font-weight:300;}

.stat-strip{background:var(--near-black);display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}
.stat-cell{padding:28px 26px;border-right:1px solid var(--near-black-2);border-top:1px solid var(--near-black-2);}
.stat-cell b{font-family:var(--font-serif);font-size:36px;line-height:1;color:var(--accent);font-weight:600;}
.stat-cell span{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-300);margin-top:10px;}

.glance-section{padding:52px 26px;background:var(--sand-50);}
.glance-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
.glance-head h2{font-size:32px;font-weight:400;}
.glance-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;}
.glance-card{text-align:left;border:1px solid var(--line);background:var(--sand-0);border-radius:20px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:12px;}
.glance-card.mine{background:var(--brand-tint);border-color:var(--brand-light);}
.glance-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.glance-time{font-family:var(--font-serif);font-size:22px;color:var(--ink-900);font-weight:600;}
.glance-tag{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:999px;font-weight:600;}
.glance-text{font-size:12.5px;color:var(--ink-500);font-weight:300;}
.glance-seats{display:flex;gap:4px;}
.glance-seats .seat{width:9px;height:9px;}

.photo-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));}
.photo-card{position:relative;border:none;padding:0;display:block;height:300px;overflow:hidden;text-align:left;background:var(--near-black);}
.photo-card .pc-bg{position:absolute;inset:0;background-size:cover;}
.photo-card .pc-scrim{position:absolute;inset:0;background:linear-gradient(to top, rgba(46,26,28,.85) 0%, rgba(46,26,28,.1) 58%, rgba(231,138,157,.18) 100%);}
.photo-card .pc-txt{position:absolute;left:26px;right:26px;bottom:24px;}
.photo-card .pc-eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
.photo-card .pc-title{font-family:var(--font-serif);font-size:26px;line-height:1.15;color:var(--sand-0);font-weight:600;}
.photo-card .pc-sub{font-size:13px;color:var(--sand-100);font-weight:300;margin-top:8px;}

.mission-section{background:var(--accent);padding:60px 26px;}
.mission-grid{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:40px;align-items:center;}
.mission-photo{min-height:340px;border-radius:20px;background-size:cover;background-position:center 22%;}
.mission-eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--brand-darker);margin-bottom:16px;}
.mission-kicker{font-family:var(--font-serif);font-weight:400;font-style:italic;font-size:30px;line-height:1.15;color:var(--near-black);margin-bottom:6px;}
.mission-title{font-family:var(--font-sans);font-size:27px;line-height:1.15;letter-spacing:.005em;text-transform:uppercase;color:var(--near-black);margin-bottom:18px;}
.mission-text{font-size:15.5px;line-height:1.75;color:var(--near-black);font-weight:300;max-width:440px;margin-bottom:20px;}

.ways-section{padding:56px 26px;background:var(--sand-50);}
.ways-list{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px;}
.way-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0;background:var(--sand-0);border:1px solid var(--line);border-radius:var(--radius-xl);overflow:hidden;}
.way-photo{min-height:210px;background-size:cover;}
.way-body{padding:30px 30px 26px;}
.way-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;}
.way-num{font-family:var(--font-serif);font-size:20px;color:var(--accent);}
.way-title{font-size:19px;letter-spacing:.1em;text-transform:uppercase;color:var(--near-black);}
.way-text{font-size:14.5px;line-height:1.7;color:var(--ink-500);font-weight:300;margin-bottom:14px;}
.way-meta{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-dark);}

.testi-section{background:var(--near-black);padding:56px 26px;}
.testi-eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:28px;max-width:1080px;margin-left:auto;margin-right:auto;}
.testi-grid{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:28px;}
.testi-quote{font-family:var(--font-serif);font-size:20px;line-height:1.45;color:var(--sand-0);font-style:italic;margin-bottom:14px;}
.testi-who{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-300);}

.closing-band{background:var(--accent);padding:48px 26px;display:flex;align-items:center;justify-content:space-between;gap:26px;flex-wrap:wrap;}
.closing-left{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.closing-left img{height:54px;width:auto;border-radius:8px;}
.closing-txt{font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:var(--near-black);line-height:1.25;}

footer.site-footer{background:var(--near-black);color:rgba(255,253,251,.7);padding:44px 0 22px;}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:30px;}
.footer-grid h5{color:#fff;font-size:13px;margin-bottom:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;}
.footer-grid p,.footer-grid a{font-size:13px;line-height:2;color:rgba(255,253,251,.6);display:block;font-weight:300;}
.footer-logo{height:32px;border-radius:6px;margin-bottom:14px;}
.footer-bottom{border-top:1px solid var(--near-black-2);margin-top:32px;padding-top:18px;font-size:12px;color:rgba(255,253,251,.4);text-align:center;}

section.section{padding:52px 26px;max-width:1080px;margin:0 auto;}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(46,26,28,.42);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal-box{background:var(--sand-0);border-radius:var(--radius-xl);padding:34px 30px;max-width:400px;width:100%;box-shadow:var(--shadow-lg);text-align:center;position:relative;animation:modalIn .2s ease;}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal-box h3{font-size:25px;margin-bottom:12px;font-weight:600;}
.modal-box p{font-size:15px;color:var(--ink-500);line-height:1.7;margin-bottom:26px;font-weight:300;}
.modal-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.modal-close{position:absolute;top:14px;right:14px;background:var(--sand-100);border:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-500);}
.login-option{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:16px;border:1.5px solid var(--line);background:var(--sand-0);margin-bottom:12px;text-align:left;transition:.15s;}
.login-option:hover{border-color:var(--brand-dark);background:var(--brand-tint);}
.login-option .lo-icon{width:42px;height:42px;border-radius:12px;background:var(--brand-tint);color:var(--brand-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.login-option strong{display:block;font-size:14.5px;}
.login-option span{display:block;font-size:12.3px;color:var(--ink-500);margin-top:2px;font-weight:300;}
.modal-foot{margin-top:4px;font-size:12px;color:var(--ink-400);text-align:center;font-weight:300;}

/* toast */
.toast-stack{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:10px;width:min(94vw,380px);align-items:center;}
.toast{background:var(--ink-900);color:var(--sand-0);padding:13px 22px;border-radius:999px;font-size:13.8px;font-weight:300;box-shadow:var(--shadow-lg);animation:toastIn .25s ease;text-align:center;}
.toast.info{background:var(--brand-darker);}
@keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.toast.leaving{animation:toastOut .2s ease forwards;}
@keyframes toastOut{to{opacity:0;transform:translateY(6px);}}

.icon{width:1em;height:1em;display:inline-block;vertical-align:-2px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

.view{display:none;}
.view.active{display:block;}

@media(max-width:640px){
  .hero-inner{padding:44px 20px 36px;}
  main.app-main{padding:34px 18px 80px;}
  .mission-grid,.stat-strip{grid-template-columns:1fr 1fr;}
  .footer-grid{grid-template-columns:1fr 1fr;}
}
@media(max-width:420px){
  .stat-strip{grid-template-columns:1fr;}
}
</style>
</head>

function pad2(n){ return n<10 ? '0'+n : ''+n; }
function isoOf(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayISO(){ return isoOf(new Date()); }
function addDays(d,n){ var r=new Date(d); r.setDate(r.getDate()+n); return r; }
function nextOpenDate(d){ var r=new Date(d); while(r.getDay()===0) r=addDays(r,1); return r; }
function buildDays(){
  var base=new Date(); base.setHours(0,0,0,0);
  var out=[];
  for(var i=0;i<7;i++){
    var d=addDays(base,i);
    out.push({
      iso: isoOf(d), num:d.getDate(), wd:DAY_NAMES[d.getDay()], sunday:d.getDay()===0,
      label: i===0 ? 'Hoy' : (i===1 ? 'Mañana' : DAY_NAMES[d.getDay()])
    });
  }
  return out;
}
var DAYS = buildDays();
function formatDateLabel(iso){
  var d=new Date(iso+'T00:00:00');
  if(iso===todayISO()) return 'Hoy';
  if(iso===isoOf(addDays(new Date(),1))) return 'Mañana';
  var n=DAY_NAMES_LONG[d.getDay()];
  return n.charAt(0).toUpperCase()+n.slice(1)+' '+d.getDate();
}
function formatDatePhrase(iso){
  if(iso===todayISO()) return 'hoy';
  if(iso===isoOf(addDays(new Date(),1))) return 'mañana';
  var d=new Date(iso+'T00:00:00');
  return DAY_NAMES_LONG[d.getDay()]+' '+d.getDate();
}

/* ---------- ocupación simulada ---------- */
function hashStr(s){ var h=0; for(var i=0;i<s.length;i++){ h=(h<<5)-h+s.charCodeAt(i); h|=0; } return Math.abs(h); }
function baseOccupancy(iso, horarioId){
  var dow = new Date(iso+'T00:00:00').getDay();
  if(dow===0) return null;
  var seed = hashStr(iso+horarioId);
  var occ;
  switch(horarioId){
    case 'h8':  occ = 7 + (seed % 2); break;
    case 'h7':  occ = 4 + (seed % 4); break;
    case 'h6':  occ = 1 + (seed % 4); break;
    case 'h18': occ = 3 + (seed % 4); break;
    case 'h19': occ = 2 + (seed % 5); break;
    default: occ = 3;
  }
  return Math.min(occ, 8);
}
function othersOccupied(iso, horarioId){
  var raw = baseOccupancy(iso, horarioId);
  if(raw===null) return 0;
  var mine = !!myBookings[iso+'|'+horarioId];
  var cap = mine ? CAPACITY-1 : CAPACITY;
  return Math.min(raw, cap);
}
function freeCount(iso, horarioId){ return CAPACITY - (othersOccupied(iso,horarioId) + (myBookings[iso+'|'+horarioId] ? 1 : 0)); }
function isMine(iso, horarioId){ return !!myBookings[iso+'|'+horarioId]; }
function myBookingForDay(iso){
  for(var i=0;i<HORARIOS.length;i++){ if(myBookings[iso+'|'+HORARIOS[i].id]) return HORARIOS[i].id; }
  return null;
}
function isWaitlisted(iso, horarioId){ return !!myWaitlist[iso+'|'+horarioId]; }
function waitlistCount(iso, horarioId){
  if(freeCount(iso,horarioId) > 0) return 0;
  var seed = hashStr('wl'+iso+horarioId);
  return horarioId==='h8' ? 1+(seed%4) : (seed%3);
}
function schedById(id){ for(var i=0;i<HORARIOS.length;i++){ if(HORARIOS[i].id===id) return HORARIOS[i]; } return null; }

/* ---------- puntos de capacidad ---------- */
function seatsHtml(iso, horarioId, extraClass){
  var mine = isMine(iso, horarioId);
  var occ = othersOccupied(iso, horarioId) + (mine?1:0);
  var html = '';
  for(var i=0;i<CAPACITY;i++){
    var cls = 'seat'+(extraClass?(' '+extraClass):'');
    if(mine && i===occ-1) cls += ' mine';
    else if(i<occ) cls += ' taken';
    html += '<span class="'+cls+'"></span>';
  }
  return html;
}

/* ---------- toasts ---------- */
function toast(msg, type){
  var stack = document.getElementById('toastStack');
  var el = document.createElement('div');
  el.className = 'toast'+(type==='info'?' info':'');
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(function(){ el.classList.add('leaving'); setTimeout(function(){ el.remove(); }, 220); }, 3200);
}

var pendingConfirm = null;
function openConfirm(opts){
  pendingConfirm = opts;
  document.getElementById('confirmTitle').textContent = opts.title;
  document.getElementById('confirmBody').textContent = opts.body;
  var btn = document.getElementById('confirmActionBtn');
  btn.textContent = opts.label;
  btn.className = 'btn ' + (opts.danger ? 'btn-primary' : 'btn-primary');
  btn.style.background = opts.danger ? 'var(--danger)' : '';

}

  document.getElementById('confirmModal').classList.remove('open');
  document.getElementById('confirmActionBtn').style.background = '';

    var fn = pendingConfirm && pendingConfirm.onConfirm;
    closeConfirm();
    if(fn) fn();
  });
});

/* ---------- acciones de reserva ---------- */
function reservarClase(iso, horarioId){
  var sched = schedById(horarioId);
  var existing = myBookingForDay(iso);
  if(existing && existing!==horarioId){
    var exSched = schedById(existing);
    var earlier = sched.startMin < exSched.startMin;
    openConfirm({
      title: earlier ? '¿Adelantar tu clase?' : '¿Cambiar tu horario?',
      body: 'Ya tienes reserva a las '+exSched.start+'. Liberaremos ese cupo y te pasaremos a las '+sched.start+' – '+sched.end+'.',
      label: earlier ? 'Sí, adelantar' : 'Sí, cambiar',
      danger:false,
      onConfirm: function(){
        delete myBookings[iso+'|'+existing];
        myBookings[iso+'|'+horarioId] = true;
        delete myWaitlist[iso+'|'+horarioId];
        toast('Listo, tu clase quedó a las '+sched.start+'.');
        render();
      }
    });
    return;
  }
  if(freeCount(iso, horarioId) <= 0) return;
  myBookings[iso+'|'+horarioId] = true;
  delete myWaitlist[iso+'|'+horarioId];
  toast('Reserva confirmada · '+sched.start+' – '+sched.end+'.');
  render();
}
function cancelarReserva(iso, horarioId){
  var sched = schedById(horarioId);
  openConfirm({
    title: '¿Cancelar tu reserva?',
    body: 'Clase de '+sched.start+' – '+sched.end+' ('+formatDatePhrase(iso)+'). El cupo queda libre para otra estudiante.',
    label: 'Sí, cancelar',
    danger:true,
    onConfirm: function(){
      delete myBookings[iso+'|'+horarioId];
      toast('Reserva cancelada. Tu cupo fue liberado.', 'info');
      render();
    }
  });
}
function toggleWaitlist(iso, horarioId){
  var key = iso+'|'+horarioId;
  if(myWaitlist[key]){ delete myWaitlist[key]; toast('Saliste de la lista de espera.', 'info'); }
  else { myWaitlist[key] = true; toast('Te avisaremos si se libera un cupo.'); }
  render();
}

var PROMOS = [
  {tag:'Promoción', text:'<b>20% de descuento</b> en tu renovación mensual si la haces antes de fin de mes.', cta:'Renovar plan', view:'renovar'},
  {tag:'Aviso', text:'El horario de <b>8h00–9h00</b> se llena primero: reserva con un día de anticipación.', cta:'Ver cupos', view:'reservar'},
  {tag:'Recomienda', text:'Trae a una amiga: <b>ambas reciben una clase gratis</b> en su primera visita juntas.', cta:'Conocer más', view:'reservar'},
  {tag:'Novedad', text:'Estrenamos <b>colchonetas nuevas</b> y música ambiental en todas las clases de la mañana.', cta:'Ver horarios', view:'reservar'}
];
var rotaTimer;
function renderRotabanner(){
  var track = document.getElementById('rotabanner');
  if(!track.dataset.built){
    var dots = document.getElementById('rotaDots');
    dots.innerHTML = PROMOS.map(function(_,i){ return '<button data-i="'+i+'"></button>'; }).join('');
    Array.prototype.forEach.call(dots.children, function(d){
      d.onclick = function(){ state.rotaIndex = +d.getAttribute('data-i'); updateRota(); resetRotaTimer(); };
    });
    track.dataset.built = '1';
    startRotaTimer();
    track.addEventListener('mouseenter', function(){ clearInterval(rotaTimer); });
    track.addEventListener('mouseleave', function(){ startRotaTimer(); });
  }
  updateRota();
}
function updateRota(){
  var p = PROMOS[state.rotaIndex % PROMOS.length];
  document.getElementById('rotaTag').textContent = p.tag;
  document.getElementById('rotaText').innerHTML = p.text;
  var cta = document.getElementById('rotaCta');
  cta.textContent = p.cta;
  cta.onclick = function(){ state.role==='guest' ? openLogin() : setView(p.view); };
  var dots = document.getElementById('rotaDots');
  Array.prototype.forEach.call(dots.children, function(d,i){ d.classList.toggle('active', i===state.rotaIndex % PROMOS.length); });
}
function startRotaTimer(){ rotaTimer = setInterval(function(){ state.rotaIndex=(state.rotaIndex+1)%PROMOS.length; updateRota(); }, 5500); }
function resetRotaTimer(){ clearInterval(rotaTimer); startRotaTimer(); }

/* ---------- Estudiante: Reservar clase ---------- */
function classCard(day, s){
  var free = freeCount(day.iso, s.id);
  var mine = isMine(day.iso, s.id);
  var full = free<=0 && !mine;
  var nowMin = (function(){ var n=new Date(); return n.getHours()*60+n.getMinutes(); })();
  var isToday = day.iso===todayISO();
  var past = isToday && s.startMin <= nowMin;

  var tag, tagClass;
  if(past){ tag='Finalizada'; tagClass='tag-past'; }
  else if(mine){ tag='Tu clase'; tagClass='tag-mine'; }
  else if(full){ tag='Completa'; tagClass='tag-full'; }
  else { tag = (s.jornada==='mañana' ? '☀ Mañana' : '☾ Noche'); tagClass='tag-open'; }

  var capacityText;
  if(past) capacityText = mine ? 'Asististe a esta clase' : 'Este horario ya pasó';
  else if(mine) capacityText = 'Tu lugar está confirmado';
  else if(full) capacityText = 'Sin cupos disponibles';
  else capacityText = free+' de '+CAPACITY+' cupos libres';

  var footer = '';
  if(!past){
    if(mine){
      footer = '<button class="btn btn-outline danger btn-block" onclick="cancelarReserva(\''+day.iso+'\',\''+s.id+'\')">Cancelar reserva</button>';
    } else if(!full){
      var existing = myBookingForDay(day.iso);
      var label = 'Reservar';
      var cls = 'btn-primary';
      if(existing){
        var earlier = s.startMin < schedById(existing).startMin;
        label = earlier ? 'Adelantar aquí' : 'Cambiar aquí';
        cls = 'btn-outline';
      }
      footer = '<button class="btn '+cls+' btn-block" onclick="reservarClase(\''+day.iso+'\',\''+s.id+'\')">'+label+'</button>';
    } else {
      var waiting = isWaitlisted(day.iso, s.id);
      footer = '<button class="btn btn-outline '+(waiting?'on':'muted')+' btn-block" onclick="toggleWaitlist(\''+day.iso+'\',\''+s.id+'\')">'+(waiting?'En lista de espera '+ICON_CHECK:'Unirme a lista de espera')+'</button>';
    }
  }

  return '<div class="class-card'+(mine?' mine':'')+(past?' past':'')+'">'+
    '<div class="card-top"><div><div class="card-time">'+s.start+' – '+s.end+'</div><div class="card-instructor">'+s.instructor+'</div></div>'+
    '<span class="tag-pill '+tagClass+'">'+tag+'</span></div>'+
    '<div class="seat-row">'+seatsHtml(day.iso, s.id)+'</div>'+
    '<div class="capacity-text">'+capacityText+'</div>'+
    '<div class="card-footer">'+footer+'</div>'+
  '</div>';
}
function renderReservar(container){
  var day = DAYS[state.dayIndex];
  var t0 = todayISO();
  var myTodayId = myBookingForDay(t0);
  var myTodaySched = myTodayId ? schedById(myTodayId) : null;

  var html = pageHead('Tu horario ideal', 'Reserva tu clase', 'Ocho cupos por clase. Ves la disponibilidad al instante y confirmas sin esperar respuesta.');

  if(myTodaySched){
    html += '<div class="info-banner">'+
      '<div class="icon-circle">'+(myTodaySched.jornada==='mañana'?'☀':'☾')+'</div>'+
      '<div class="txt"><small>Tu próxima clase</small><b>Hoy, '+myTodaySched.start+' – '+myTodaySched.end+'</b><span class="meta">Con '+myTodaySched.instructor+'</span></div>'+
      '<button class="btn btn-outline danger btn-sm" onclick="cancelarReserva(\''+t0+'\',\''+myTodayId+'\')">Cancelar reserva</button>'+
    '</div>';
  }

  html += '<div class="day-selector">'+DAYS.map(function(d,i){
    return '<button class="day-pill '+(i===state.dayIndex?'active':'')+(d.sunday?' closed':'')+'" onclick="selectDay('+i+')">'+
      '<span class="dn">'+d.label+'</span><span class="num">'+d.num+'</span></button>';
  }).join('')+'</div>';

  if(day.sunday){
    html += '<div class="closed-state"><h3>El estudio descansa los domingos</h3><p>Elige otro día para ver los horarios disponibles.</p></div>';
  } else {
    if(day.iso===t0 && myTodaySched){
      var hasEarlierFree = HORARIOS.some(function(s){ return s.startMin < myTodaySched.startMin && freeCount(day.iso, s.id) > 0; });
      if(hasEarlierFree){
        html += '<div class="move-hint">Tienes clase hoy a las '+myTodaySched.start+'. Si te conviene más temprano, elige un horario disponible más abajo para <b>adelantar tu clase</b>.</div>';
      }
    }
    html += '<div class="schedule-grid">'+HORARIOS.map(function(s){ return classCard(day, s); }).join('')+'</div>';
  }

  container.className = 'app-main';
  container.innerHTML = html;
}
function selectDay(i){ state.dayIndex = i; render(); }
